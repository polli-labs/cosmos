[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "polli-cosmos"
version = "0.8.0"
description = "Provenance-first video normalization toolkit for ingest, crop, and web optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Polli Labs" }]
dependencies = [
  "questionary>=2.0.1",
  "tqdm>=4.67.1",
  "psutil>=6.1.0",
  "typer>=0.12.5",
  "pydantic>=2.7,<3",
  "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6.9",
  "ty>=0.0.1a0,<1",
  "types-PyYAML",
]

# Docs extra – used by the docs workflow (mkdocs build)
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings>=0.24,<1",
  "mkdocstrings-python>=1.10,<2"
]
release = [
  "build>=1.2,<2",
  "hatchling>=1.24,<2",
  "twine>=6,<7",
]
video-av = [
    "av>=14,<17",
    "numpy>=1.26,<3",
]
video-torchcodec = [
    "numpy>=1.26,<3",
    "torch>=2.11,<2.12",
    "torchcodec>=0.11.1,<0.12",
]

[project.scripts]
cosmos = "cosmos.cli.cosmos_app:main"

[tool.hatch.build]
include = ["cosmos/**", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["cosmos"]
target-version = "py310"

[tool.ruff.lint]
select = ["E","F","I","UP","S","B","A","T20","C90"]
ignore = []

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "-q"
minversion = "7.0"
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "video-torchcodec" },
]
torchcodec = [
    { index = "pytorch-cpu", extra = "video-torchcodec" },
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["cosmos/**/*.py", "tests/**/*.py"]

[tool.ty.terminal]
output-format = "full"
error-on-warning = true
